server {
    listen 80;
    listen [::]:80;
    server_name casaindia.haloandrei.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/halo-return-acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name casaindia.haloandrei.com;

    ssl_certificate /etc/letsencrypt/live/casaindia.haloandrei.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/casaindia.haloandrei.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://192.168.0.143:18088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
